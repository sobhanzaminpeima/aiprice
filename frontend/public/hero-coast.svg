<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05121f"/>
      <stop offset=".45" stop-color="#0b3050"/>
      <stop offset=".62" stop-color="#1d5a78"/>
      <stop offset=".7" stop-color="#e3a35f" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="sun" cx=".72" cy=".64" r=".35">
      <stop offset="0" stop-color="#ffd59a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd59a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b5876"/>
      <stop offset=".35" stop-color="#0d3a58"/>
      <stop offset="1" stop-color="#051726"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd58a" stop-opacity=".95"/>
      <stop offset="1" stop-color="#f0a85a" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12C5E8"/><stop offset="1" stop-color="#5fe3ff"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>
  <g fill="#ffffff" fill-opacity=".55">
    <circle cx="180" cy="90" r="1.3"/><circle cx="320" cy="150" r="1"/><circle cx="520" cy="70" r="1.2"/><circle cx="760" cy="120" r="1"/>
    <circle cx="980" cy="60" r="1.3"/><circle cx="1210" cy="110" r="1"/><circle cx="1420" cy="80" r="1.2"/><circle cx="1500" cy="170" r="1"/>
  </g>

  <!-- Beşparmak (Five Finger) mountains -->
  <path d="M0 520 L90 470 L160 488 L250 430 L320 452 L410 395 L470 420 L540 380 L600 405 L690 360 L760 392 L840 372 L930 410 L1010 386 L1100 420 L1190 398 L1290 440 L1380 418 L1480 455 L1600 440 V600 H0 Z" fill="#103a57" fill-opacity=".85"/>
  <path d="M0 560 L120 520 L230 540 L330 505 L450 532 L560 498 L660 528 L780 505 L900 540 L1030 515 L1160 548 L1290 522 L1420 552 L1600 530 V620 H0 Z" fill="#0a2c45"/>

  <!-- Sea -->
  <rect y="598" width="1600" height="302" fill="url(#sea)"/>
  <g stroke="#ffd9a0" stroke-linecap="round" stroke-opacity=".35">
    <line x1="1080" y1="630" x2="1240" y2="630" stroke-width="3"/><line x1="1110" y1="655" x2="1220" y2="655" stroke-width="2"/>
    <line x1="1060" y1="685" x2="1260" y2="685" stroke-width="2"/><line x1="1130" y1="715" x2="1200" y2="715" stroke-width="1.5"/>
  </g>
  <g stroke="#7fc8e8" stroke-linecap="round" stroke-opacity=".18" stroke-width="2">
    <line x1="120" y1="700" x2="300" y2="700"/><line x1="420" y1="760" x2="640" y2="760"/><line x1="760" y1="820" x2="980" y2="820"/><line x1="200" y1="850" x2="360" y2="850"/>
  </g>

  <!-- Kyrenia harbour: castle and old town -->
  <g fill="#06192a">
    <path d="M40 600 V548 h26 v-14 h12 v14 h40 v-22 h14 v22 h60 v-30 h20 v30 h40 v52 Z"/>
    <rect x="250" y="560" width="40" height="40"/><rect x="295" y="548" width="34" height="52"/><rect x="334" y="566" width="46" height="34"/>
    <rect x="385" y="552" width="30" height="48"/><rect x="420" y="570" width="54" height="30"/><rect x="478" y="558" width="36" height="42"/>
    <path d="M30 600 h520 v10 H30 Z"/>
  </g>
  <g fill="#ffd27a" fill-opacity=".85">
    <rect x="262" y="572" width="5" height="6"/><rect x="306" y="562" width="5" height="6"/><rect x="318" y="580" width="5" height="6"/>
    <rect x="348" y="578" width="5" height="6"/><rect x="394" y="566" width="5" height="6"/><rect x="436" y="582" width="5" height="6"/>
    <rect x="490" y="570" width="5" height="6"/><rect x="452" y="582" width="5" height="6"/>
  </g>
  <g stroke="#06192a" stroke-width="2"><line x1="580" y1="612" x2="580" y2="560"/><line x1="610" y1="612" x2="610" y2="570"/></g>
  <path d="M566 612 h30 l-6 10 h-20 Z M598 612 h26 l-5 9 h-17 Z" fill="#06192a"/>

  <!-- Modern villa with pool -->
  <g>
    <path d="M1040 610 V520 H1560 V610 Z" fill="#071d30"/>
    <path d="M1010 522 H1590 V506 H1010 Z" fill="#0b2a42"/>
    <rect x="1080" y="532" width="150" height="64" fill="url(#glass)"/>
    <rect x="1250" y="532" width="110" height="64" fill="url(#glass)" fill-opacity=".85"/>
    <rect x="1380" y="532" width="150" height="64" fill="url(#glass)"/>
    <path d="M1150 506 V430 H1480 V506 Z" fill="#081f34"/>
    <path d="M1120 432 H1510 V418 H1120 Z" fill="#0b2a42"/>
    <rect x="1180" y="444" width="120" height="52" fill="url(#glass)" fill-opacity=".9"/>
    <rect x="1320" y="444" width="130" height="52" fill="url(#glass)"/>
    <g stroke="#071d30" stroke-width="3"><line x1="1155" y1="532" x2="1155" y2="596"/><line x1="1455" y1="532" x2="1455" y2="596"/><line x1="1240" y1="444" x2="1240" y2="496"/><line x1="1385" y1="444" x2="1385" y2="496"/></g>
    <path d="M980 610 H1600 V640 H980 Z" fill="#06192a"/>
    <rect x="1060" y="616" width="420" height="16" rx="3" fill="url(#pool)" fill-opacity=".85"/>
  </g>

  <!-- Palms -->
  <g fill="#04131f">
    <path d="M940 612 C936 560 944 520 958 480 l4 2 C950 520 946 560 948 612 Z"/>
    <path d="M960 482 c-30 -14 -62 -6 -82 10 c26 -6 52 -4 82 -6 Z M960 482 c26 -22 60 -24 86 -10 c-30 -2 -58 4 -86 14 Z M960 482 c-10 -26 -36 -42 -62 -42 c22 10 42 24 58 44 Z M960 482 c14 -26 40 -38 66 -34 c-24 6 -44 18 -62 36 Z"/>
    <path d="M1588 612 C1584 570 1590 536 1600 506 l4 2 V612 Z"/>
  </g>

  <!-- Coastal road with a car -->
  <path d="M0 640 H980 V652 H0 Z" fill="#06192a"/>
  <g transform="translate(760 618)" fill="#0a2236">
    <path d="M0 22 c2 -10 10 -14 22 -16 l18 -10 h48 l20 12 c14 2 22 6 24 14 v8 H0 Z"/>
    <circle cx="28" cy="30" r="8" fill="#04131f"/><circle cx="104" cy="30" r="8" fill="#04131f"/>
    <path d="M44 4 h20 v12 H32 Z M68 4 h18 l12 12 H68 Z" fill="#8fd8f0" fill-opacity=".55"/>
    <rect x="128" y="16" width="6" height="4" fill="#ffe7a8"/>
  </g>
</svg>
