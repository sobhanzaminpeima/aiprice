<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v2.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16-v2.png">
    <link rel="alternate icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v2.png">
    <link rel="manifest" href="/manifest.json?v=2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AIPrice.app — Know the value, not just the price. AI price estimates for cars and property in North Cyprus and Turkey." />
    <meta name="theme-color" content="#ffffff">
    <script>try{var t=localStorage.getItem("aiprice_theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);var l=localStorage.getItem("aiprice_lang");if(l==="fa"||l==="tr"){document.documentElement.lang=l;document.documentElement.dir=l==="fa"?"rtl":"ltr"}}catch(e){}</script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI Price">
    <meta name="application-name" content="AI Price">
    <title>AIPrice.app — AI-Powered Marketplace Intelligence</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
